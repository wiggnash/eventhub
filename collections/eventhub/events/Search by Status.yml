info:
  name: Search by Status
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}events/1/?status=upcoming"
  params:
    - name: status
      value: upcoming
      type: query
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
